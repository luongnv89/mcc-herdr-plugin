name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: node --check panel.js && node --check toggle.js && node --check bind-key.js
      - name: Manifest
        run: |
          python3 - <<'PY'
          import tomllib
          m = tomllib.load(open("herdr-plugin.toml", "rb"))
          missing = [k for k in ("id", "name", "version", "min_herdr_version") if k not in m]
          assert not missing, f"missing: {missing}"
          print(m["id"], m["version"])
          PY
      - name: Tests
        run: node --test test/*.test.js
